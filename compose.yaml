name: chessbot

services:

  bot:
    build:
      context: .
    environment:
      - NODE_ENV=${NODE_ENV}
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_NAME=${BOT_NAME}
      - LOG_INFO_CHANNEL=${LOG_INFO_CHANNEL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_CLIENT=${DB_CLIENT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_MIGRATIONS_TABLE=${DB_MIGRATIONS_TABLE}
    depends_on:
      psql:
        condition: service_healthy
    networks:
      inner-net:
        ipv4_address: 10.3.3.4
    command: [ "npm", "run", "dev" ]
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

  psql:
    image: postgres:17
    hostname: ${DB_HOST}
    container_name: ${DB_HOST}
    restart: always
    user: postgres
    networks:
      inner-net:
        ipv4_address: 10.3.3.3
    volumes:
      - pg-data-2:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg-data-2:

networks:
  inner-net:
    ipam:
      driver: default
      config:
        - subnet: "10.3.3.0/24"
